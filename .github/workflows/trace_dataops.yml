name: TRACE Automated DataOps Pipeline

on:
  # 1. Scheduled run every 15 minutes (UTC)
  schedule:
    - cron: '*/15 * * * *'
  
  # 2. Manual trigger from GitHub UI anytime
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual execution'
        required: false
        default: 'Manual on-demand sync'

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Sync Grievances & Refresh Power BI Data Marts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PG_HOST: ${{ secrets.PG_HOST || 'aws-0-ap-northeast-1.pooler.supabase.com' }}
      PG_PORT: ${{ secrets.PG_PORT || '5432' }}
      PG_DATABASE: ${{ secrets.PG_DATABASE || 'postgres' }}
      PG_USER: ${{ secrets.PG_USER || 'postgres.ilfwynrwvufabnsjesum' }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_SSLMODE: 'require'
      FEEDBACK_API_URL: 'https://trace-feedback.vercel.app'
      FEEDBACK_ADMIN_KEY: ${{ secrets.FEEDBACK_ADMIN_KEY || 'trace_admin_secret_key_change_in_prod' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Ingest QR Grievances from Vercel to Supabase Cloud
        run: |
          echo "Connecting to Vercel API and syncing new feedback to Supabase Cloud..."
          python etl/ingest_feedback_api.py

      - name: Step 2 - Refresh Power BI Data Marts from Supabase Cloud
        run: |
          echo "Exporting fresh analytical CSVs from Supabase Cloud..."
          python dashboard/export_for_powerbi.py

      - name: Step 3 - Commit & Push Updated Data to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard/export/*.csv
          git add -f data/bronze/complaints/watermark.txt || true
          if git diff --staged --quiet; then
            echo "Datasets are already up to date. Nothing to commit."
          else
            git commit -m "chore(dataops): automated refresh of Power BI data marts [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
