name: TRACE Automated DataOps Pipeline

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual execution'
        required: false
        default: 'Manual on-demand sync'

permissions:
  contents: write

env:
  PG_HOST: ${{ secrets.PG_HOST || 'aws-0-ap-northeast-1.pooler.supabase.com' }}
  PG_PORT: ${{ secrets.PG_PORT || '5432' }}
  PG_DATABASE: ${{ secrets.PG_DATABASE || 'postgres' }}
  PG_USER: ${{ secrets.PG_USER || 'postgres.ilfwynrwvufabnsjesum' }}
  PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
  PG_SSLMODE: 'require'
  FEEDBACK_API_URL: 'https://trace-feedback.vercel.app'
  FEEDBACK_ADMIN_KEY: ${{ secrets.FEEDBACK_ADMIN_KEY || 'trace_admin_secret_key_change_in_prod' }}
  OTD_API_KEY: ${{ secrets.OTD_API_KEY || 'kV0HS8CSWr6NmORI1XIPRqXm62fujtio' }}
  OTD_VEHICLE_POSITIONS_URL: 'https://otd.delhi.gov.in/api/realtime/VehiclePositions.pb'

jobs:
  ingest-grievances:
    name: Ingest QR Grievances (Vercel -> Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Sync Grievances from Vercel to Supabase
        run: |
          python etl/ingest_feedback_api.py

  ingest-telemetry:
    name: Ingest GTFS-RT Telemetry (OTD -> Silver -> Gold)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 1. Poll Live Delhi Bus Positions (OTD API)
        run: |
          python collector/poll_gtfs_rt.py --count 1 --force

      - name: 2. Transform Raw .pb to Silver Parquet
        run: |
          python etl/realtime_to_silver.py

      - name: 3. Calculate Delays/OTP & Load to Supabase Gold Layer
        run: |
          python etl/load_facts.py actual

  publish-powerbi:
    name: Export Power BI Data Marts & Git Sync
    needs: [ingest-grievances, ingest-telemetry]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Export Fresh Data Marts from Supabase Cloud
        run: |
          python dashboard/export_for_powerbi.py

      - name: Commit & Push Updated Data to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard/export/*.csv dashboard/export/dataops_heartbeat.json
          git add -f data/bronze/complaints/watermark.txt || true
          if git diff --staged --quiet; then
            echo "Datasets are already up to date. Nothing to commit."
          else
            git commit -m "chore(dataops): automated refresh of Power BI data marts [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
